<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="whiteGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main rounded rectangle background -->
  <rect width="128" height="128" rx="28" ry="28" fill="url(#gradient)"/>
  
  <!-- Camera/Video icon in center -->
  <g transform="translate(24, 28)">
    <!-- Camera body -->
    <rect x="0" y="16" width="80" height="56" rx="8" ry="8" fill="url(#whiteGradient)"/>
    
    <!-- Lens -->
    <circle cx="40" cy="44" r="18" fill="#667eea" opacity="0.3"/>
    <circle cx="40" cy="44" r="14" fill="#764ba2" opacity="0.5"/>
    <circle cx="40" cy="44" r="10" fill="#667eea"/>
    
    <!-- Recording dot -->
    <circle cx="65" cy="26" r="5" fill="#ef4444"/>
    
    <!-- Viewfinder -->
    <rect x="50" y="20" width="18" height="12" rx="2" ry="2" fill="#ffffff" opacity="0.8"/>
  </g>
  
  <!-- Download arrow at bottom -->
  <g transform="translate(48, 88)">
    <path d="M 16 0 L 16 16 L 8 16 L 20 28 L 32 16 L 24 16 L 24 0 Z" fill="#ffffff" opacity="0.9"/>
  </g>
  
  <!-- Instagram-like border accent -->
  <rect width="128" height="128" rx="28" ry="28" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3"/>
</svg>
