[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "instagram-reels-downloader"
version = "2.0.0"
description = "A fast, modern GTK4 app for downloading Instagram reels"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aznit11" }]
keywords = ["instagram", "reels", "downloader", "gtk", "libadwaita", "video"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: X11 Applications :: GTK",
  "Intended Audience :: End Users/Desktop",
  "Natural Language :: English",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "PyGObject>=3.42",
  "yt-dlp>=2024.8.6",
]

[project.urls]
Homepage = "https://github.com/Aznit11/instagram-reels-downloader"
Issues = "https://github.com/Aznit11/instagram-reels-downloader/issues"

[project.scripts]
instagram-reels-downloader = "ird.app:main"

[project.gui-scripts]
instagram-reels-downloader-gui = "ird.app:main"

[tool.setuptools]
packages = ["ird", "ird.ui"]
include-package-data = true

[tool.setuptools.package-data]
ird = ["style.css"]

[tool.setuptools.data-files]
"share/applications" = ["io.github.aznit11.InstagramReelsDownloader.desktop"]
"share/icons/hicolor/scalable/apps" = ["instagram-reels-downloader.svg"]
